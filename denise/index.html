<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Casa Dê · Moda feminina e infantil</title>
  <meta name="description" content="Moda feminina e infantil com pedido pelo WhatsApp.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="faixa" id="faixa" hidden></div>

  <header class="topo">
    <div class="topo-linha">
      <a href="#" class="marca" id="marca"></a>
      <nav class="abas" id="abas-dep" aria-label="Departamentos"></nav>
      <button class="botao-sacola" id="abrir-sacola" aria-label="Abrir sacola">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M5 8h14l-1 12H6L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="contador" id="contador" hidden>0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1 id="slogan"></h1>
    <p id="descricao"></p>
    <div class="carrossel" id="carrossel" aria-roledescription="carrossel" aria-label="Destaques" hidden>
      <div class="trilho" id="trilho"></div>
      <button class="seta seta-ant" id="seta-ant" aria-label="Anterior">‹</button>
      <button class="seta seta-prox" id="seta-prox" aria-label="Próximo">›</button>
      <div class="pontos" id="pontos"></div>
    </div>
    <div class="departamentos" id="departamentos"></div>
  </section>

  <main id="colecao" class="colecao">
    <div class="barra">
      <h2 id="titulo-colecao">Coleção</h2>
      <label class="busca">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="search" id="busca" placeholder="Buscar peça" aria-label="Buscar peça">
      </label>
    </div>
    <div class="chips" id="filtros"></div>
    <div class="grade" id="grade"></div>
  </main>

  <section id="sobre" class="passos">
    <div><span>1</span><p><strong>Escolha</strong> peças e tamanhos</p></div>
    <div><span>2</span><p><strong>Monte a sacola</strong> com o que quiser</p></div>
    <div><span>3</span><p><strong>Finalize no WhatsApp</strong> · Pix, cartão ou dinheiro</p></div>
  </section>

  <footer id="contato" class="rodape">
    <span class="rodape-marca" id="rodape-marca"></span>
    <span id="cidade"></span>
    <span class="redes">
      <a id="link-whats" target="_blank" rel="noopener">WhatsApp</a>
      <a id="link-insta" target="_blank" rel="noopener">Instagram</a>
    </span>
    <small>© <span id="ano"></span> <span id="nome-rodape"></span></small>
  </footer>

  <a class="whats-flutuante" id="whats-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.2-.2-.2-.5-.4Z"/></svg>
  </a>

  <dialog id="detalhe" class="detalhe">
    <button class="fechar" data-fechar aria-label="Fechar">×</button>
    <div class="detalhe-corpo" id="detalhe-corpo"></div>
  </dialog>

  <dialog id="sacola" class="sacola">
    <div class="sacola-topo">
      <h3>Sacola</h3>
      <button class="fechar" data-fechar aria-label="Fechar">×</button>
    </div>
    <div class="sacola-itens" id="sacola-itens"></div>
    <div class="sacola-rodape" id="sacola-rodape"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
