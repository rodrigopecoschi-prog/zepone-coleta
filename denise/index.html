<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denise · Moda feminina e infantil</title>
  <meta name="description" content="Moda feminina e infantil com pedido pelo WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="faixa" id="faixa" hidden></div>

  <header class="topo">
    <a href="#" class="marca" id="marca"></a>
    <nav id="menu"></nav>
    <button class="botao-sacola" id="abrir-sacola" aria-label="Abrir sacola">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M5 8h14l-1 12H6L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="contador" id="contador" hidden>0</span>
    </button>
  </header>

  <section class="hero">
    <p class="hero-tag">Feminino · Infantil</p>
    <h1 id="slogan"></h1>
    <p class="hero-texto" id="descricao"></p>
    <div class="departamentos" id="departamentos"></div>
  </section>

  <main id="colecao" class="colecao">
    <h2 id="titulo-colecao">Coleção</h2>
    <div class="filtros" id="abas-dep" role="tablist"></div>
    <div class="filtros filtros-cat" id="filtros"></div>
    <div class="grade" id="grade"></div>
  </main>

  <section id="sobre" class="sobre">
    <h2>Como comprar</h2>
    <ul class="passos">
      <li><span>01</span><strong>Escolha</strong>Peças e tamanhos que você gostou</li>
      <li><span>02</span><strong>Monte a sacola</strong>Adicione quantas peças quiser</li>
      <li><span>03</span><strong>Finalize no WhatsApp</strong>Combinamos pagamento e entrega</li>
    </ul>
    <p class="pagamentos">Pix · Cartão · Dinheiro &nbsp;—&nbsp; Entrega ou retirada</p>
  </section>

  <footer id="contato" class="rodape">
    <div class="rodape-marca" id="rodape-marca"></div>
    <p id="cidade"></p>
    <div class="redes">
      <a id="link-whats" target="_blank" rel="noopener">WhatsApp</a>
      <a id="link-insta" target="_blank" rel="noopener">Instagram</a>
    </div>
    <small>© <span id="ano"></span> <span id="nome-rodape"></span></small>
  </footer>

  <a class="whats-flutuante" id="whats-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.2-.2-.2-.5-.4Z"/></svg>
  </a>

  <dialog id="detalhe" class="detalhe">
    <button class="fechar" data-fechar aria-label="Fechar">×</button>
    <div class="detalhe-corpo" id="detalhe-corpo"></div>
  </dialog>

  <dialog id="sacola" class="sacola">
    <div class="sacola-topo">
      <h3>Sua sacola</h3>
      <button class="fechar" data-fechar aria-label="Fechar">×</button>
    </div>
    <div class="sacola-itens" id="sacola-itens"></div>
    <div class="sacola-rodape" id="sacola-rodape"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
