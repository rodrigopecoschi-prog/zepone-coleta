name: Coleta ZepOne

on:
  schedule:
    # 9h, 11h, 14h, 17h e 19h de Brasília (UTC-3); o GitHub pode atrasar alguns minutos
    - cron: "0 12,14,17,20,22 * * *"
  workflow_dispatch:
    inputs:
      so:
        description: "O que atualizar"
        type: choice
        options: [tudo, acomp, campanhas]
        default: tudo
      completo:
        description: "Campanhas completas (inventário, criativos e segmentos)"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e enviar ao Drive
        env:
          GAM_SERVICE_ACCOUNT: ${{ secrets.GAM_SERVICE_ACCOUNT }}
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
          MEMBRANA_ACCESS_KEY: ${{ secrets.MEMBRANA_ACCESS_KEY }}
          SEEDTAG_API_KEY: ${{ secrets.SEEDTAG_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ZEPONE_DRIVE_ID: ${{ secrets.ZEPONE_DRIVE_ID }}
        run: python executar.py --so "${{ inputs.so || 'tudo' }}" ${{ inputs.completo && '--completo' || '' }}
